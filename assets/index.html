<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>사건 게임 에디터</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"></head><body>
<header id="appHeader" hidden><button id="editorHome" class="quiet iconButton" aria-label="처음 화면">‹</button><div class="headerTitle" id="editorBrand"><strong>사건 게임 에디터</strong><small id="saveStatus" role="status">자동 저장됨</small></div><button id="undoEdit" class="quiet iconButton" aria-label="되돌리기" disabled>↶</button><button id="redoEdit" class="quiet iconButton" aria-label="다시 실행" hidden disabled>↷</button><button id="publish">플레이에 반영</button><button id="files" aria-label="게임 관리와 점검">⋯</button><button id="exitPreview" hidden>편집으로</button><button id="quickTest" hidden>조건 비교</button></header><div id="editTools" hidden><button id="checkStory">점검</button></div><main><section id="home" class="page"><div class="homeContent"><h1>사건 게임</h1><button id="openEditor" class="homeChoice" disabled><b>1 · 에디터</b><span>이야기를 만들고 저장하기</span></button><button id="openPlayer" class="homeChoice" disabled><b>2 · 플레이</b><span>반영한 게임을 골라 플레이하기</span></button><p id="homeMessage" class="hint">게임을 불러오는 중입니다.</p><div id="appUpdate" class="appUpdate" hidden><p id="appUpdateText" class="hint" role="status"></p><div class="row"><button id="appUpdateAction" hidden></button><button id="appUpdateCheck" class="quiet">업데이트 확인</button></div><label class="appUpdateAuto"><input type="checkbox" id="appUpdateAuto"> 새 버전 자동 업데이트</label></div></div></section><section id="gameList" class="page" hidden><div class="listTop"><button id="listBack" class="quiet">← 처음</button><h2 id="listTitle"></h2><button id="newGame" hidden>＋ 새 게임</button></div><div id="gameCards" class="scroll"></div></section>
<section id="story" class="page"><div class="events"><button id="prevEvent" class="eventArrow quiet" aria-label="이전 사건" title="이전 사건"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5L8 12L15 19"/></svg></button><div id="eventList"></div><button id="nextEvent" class="eventArrow quiet" aria-label="다음 사건" title="다음 사건"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L16 12L9 19"/></svg></button><button id="addEvent" class="iconButton" aria-label="새 사건">＋</button><button id="testHere" aria-label="이 사건부터 테스트">▶ 여기부터</button></div><div class="subtabs"><button data-part="content">내용</button><button data-part="choices">선택지</button><button data-part="art">그림</button><button data-part="fx">연출</button><button data-part="sound">소리</button></div><div id="editor" class="scroll"></div></section>
<section id="inventory" class="page" hidden><div class="scroll invLayout"><div class="startState"><b>시작 상태</b><div class="startGrid"><label>체력<input id="initialHp" type="number" min="1" max="3"></label><label>멘탈<input id="initialMental" type="number" min="1" max="3"></label><label>돈<input id="initialMoney" type="number" min="0" max="3"></label></div><label class="startAbility">시작 능력<select id="randomStart"><option value="2">무작위 능력 2개 · 원작 방식</option><option value="0">등록한 시작 보유량만</option></select></label><input id="maxHp" type="number" value="3" hidden><p id="startWarning" class="hint loss" hidden>무작위 시작 능력은 능력이 2개 이상 있어야 합니다.</p></div><div class="defHead"><b>보유 항목 <small id="defCount"></small></b><input id="defSearch" type="search" placeholder="찾기" aria-label="보유 항목 찾기"><button id="addDef" aria-label="보유 항목 추가">＋</button></div><div class="fxAreaTabs defTabs" role="tablist" aria-label="종류"><button role="tab" data-def-filter="all">전체</button><button role="tab" data-def-filter="ability">능력</button><button role="tab" data-def-filter="item">아이템</button><button role="tab" data-def-filter="state">상태</button><button role="tab" data-def-filter="memory">기억</button><button role="tab" data-def-filter="affinity">호감도</button></div><div id="definitions"></div><div id="defPager" class="libPager"></div></div></section>
<section id="test" class="page" hidden><div id="stage"><div id="upper" class="art" data-fx-slot="top"></div><div id="lower" class="art" data-fx-slot="bottom"></div><div id="divider"></div><div id="conversation" data-fx-front><div id="statusBar" aria-label="상태 표시줄"><div id="statusIcons"><div id="health" role="img"></div><div id="mental" role="img"></div><div id="money" role="img"></div><button id="bag" aria-label="보유한 것 열기" title="보유한 것"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5a4 4 0 0 1 8 0v2M7 7h10a3 3 0 0 1 3 3v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a3 3 0 0 1 3-3Z"/><path d="M8 13h8v5H8zM4 11h3M17 11h3"/></svg></button></div><div id="statusMessage" role="button" tabindex="0" aria-live="polite" hidden><span id="statusSymbol" hidden></span><span id="statusText"></span></div></div><div id="box" tabindex="0" aria-label="대화와 선택지"><div id="transcript"></div><div id="currentPage"><b id="who"></b><p id="dialogue"></p><div id="answers"></div></div><div id="moreCue" aria-hidden="true"></div></div><div id="acquisitionArt" role="button" tabindex="0" hidden></div><div id="rewardFx" aria-hidden="true"></div><div id="sceneTools" aria-label="대화·배경 보기와 창 투명도"><button id="viewHistory" aria-label="이전 대화 보기">이전 대화</button><button id="viewBackground">배경 보기</button><label id="opacityControl"><span>투명도</span><input id="panelTransparency" type="range" min="0" max="100" step="1" value="0" aria-label="창 투명도" aria-valuetext="0% 투명"><output id="panelTransparencyValue" class="readerText">0%</output></label></div></div><button id="restoreDialogue" aria-label="대화창으로 돌아가기" hidden><span>터치하면 대화창으로 돌아갑니다</span></button></div></section>
<section id="gameTitle" class="page titleFrame" hidden><div id="titleCover" class="titleCover" data-title="cover"></div><div class="titleShade"></div><div id="titleCard" class="titleCard"><div class="titleCopy"><h1 id="gameName" class="titleHeading" data-title="name"></h1><p id="gameIntro" class="titleIntro" data-title="intro"></p><small id="gameAuthor" class="titleAuthor" data-title="author"></small></div><button id="titleStart" class="titleButton titleButtonPrimary" data-title="start">시작하기</button><div class="titleActions"><button id="titleRestart" class="titleButton" data-title="restart" hidden>처음부터</button><button id="titleCredits" class="titleButton" data-title="credits" hidden>크레딧</button></div></div></section></main><nav id="editorNav" hidden><button data-page="story">이야기</button><button data-page="inventory">보유 항목</button><button data-page="test">▶ 테스트</button></nav><dialog id="modal"><div class="modalTop"><b id="modalTitle"></b><button id="closeModal">닫기</button></div><div id="modalBody"></div></dialog><dialog id="artSheet" aria-labelledby="artTitle"><div class="modalTop"><b id="artTitle">그림 모음</b><button id="closeArt">닫기</button></div><div id="artBody"></div></dialog><dialog id="historySheet" aria-labelledby="historyTitle"><div class="historyHead"><b id="historyTitle">이전 대화</b><button id="closeHistory">닫기</button></div><div id="historyPages" tabindex="0" aria-label="이전 대화 기록"></div></dialog><dialog id="stateSheet" aria-labelledby="stateTitle"><div class="sheetHead"><b id="stateTitle">보유 상태</b><span id="sheetHealth"></span><button id="soundToggle" class="quiet" aria-label="효과음 켜짐" title="효과음" aria-pressed="true"></button><button id="closeState" class="quiet">닫기</button></div><div id="stateTabs"><button data-state-tab="all">전체</button><button data-state-tab="ability">능력</button><button data-state-tab="item">아이템</button><button data-state-tab="state">상태</button><button id="affinityTab" data-state-tab="affinity" aria-label="호감도" hidden>호감</button><button id="savesTab" data-state-tab="saves" hidden>저장</button><button data-state-tab="settings">설정</button></div><div id="stateItems"></div><button id="retry" hidden>처음부터 다시</button><div id="testTools"><button id="undoTest" disabled>테스트 되돌리기</button><button id="editCurrent">현재 장면 편집</button><button id="adjustTest">보유량 설정</button></div></dialog><dialog id="cropSheet" aria-label="그림 표시 위치 조절"><div id="cropFrame" tabindex="0" aria-label="그림을 드래그하고 두 손가락으로 확대"></div><div id="cropControls"><small>드래그 · 두 손가락 확대</small><button id="cropReset">초기화</button><button id="cropDone">완료</button></div></dialog><dialog id="creditsSheet" aria-labelledby="creditsTitle"><div class="historyHead"><b id="creditsTitle">제작자 크레딧</b><button id="closeCredits">닫기</button></div><div class="creditsBody"><b id="creditsAuthor"></b><p id="creditsText"></p><div id="creditsSounds" hidden><b>음악·소리</b><ul></ul></div></div></dialog><div id="toast" role="status"></div><input id="imageFile" type="file" accept="image/*" hidden><input id="audioFile" type="file" accept="audio/*" hidden><input id="creatorFile" type="file" accept=".json,application/json" hidden><input id="latestApkFile" type="file" accept=".apk,application/vnd.android.package-archive" hidden><input id="projectFile" type="file" accept=".json,application/json" hidden><script src="sample.js"></script><script src="variation-sample.js"></script><script src="showcase-sample.js"></script><script src="themes.js"></script><script src="variations.js"></script><script src="core.js"></script><script src="history.js"></script><script src="depot.js"></script><script src="vault.js"></script><script src="saves.js"></script><script src="examples.js"></script><script src="audio.js"></script><script src="sound-library.js"></script><script src="sound-editor.js"></script><script src="feedback.js"></script><script src="game-management.js"></script><script src="image-compose.js"></script><script src="media-pack.js"></script><script src="stage-fx.js"></script><script src="stage-editor.js"></script><script src="story-map.js"></script><script src="art-library.js"></script><script src="art-picker.js"></script><script src="game-title.js"></script><script src="creator-backup.js"></script><script src="brace-input.js"></script><script src="editor-variations.js"></script><script src="app.js"></script></body></html>
